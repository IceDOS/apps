name: Update bbsc-gameserver

# Thin wrapper: all logic lives in .github/workflows/module-update.yml. The
# updater opens a PR and cache-server's external build gates the merge, so this
# repo's main only advances after a green build.
on:
  schedule:
    # GitHub may delay or skip scheduled runs, and they only run on the default branch.
    - cron: "10 14 * * *"
  workflow_dispatch:
permissions: {}

jobs:
  update:
    uses: ./.github/workflows/module-update.yml
    with:
      module: bbsc-gameserver
      paths: modules/fromsoftware/bloodborne/bbsc-gameserver
      command: nix-shell modules/fromsoftware/bloodborne/bbsc-gameserver/update.sh
      version-file: modules/fromsoftware/bloodborne/bbsc-gameserver/source.json
    secrets: inherit
