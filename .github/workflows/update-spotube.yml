name: Update Spotube Nightly and Git

# Thin wrapper: all logic lives in .github/workflows/module-update.yml. The
# updater opens a PR and cache-server's external build gates the merge, so this
# repo's main only advances after a green build.
on:
  schedule:
    # GitHub may delay or skip scheduled runs, and they only run on the default branch.
    - cron: "10 9 * * *"
  workflow_dispatch:
permissions: {}

# Separate jobs and PRs, so a broken git build never holds back the nightly pin.
# Upstream re-uploads the nightly deb in place, which breaks the old hash at once.
jobs:
  nightly:
    uses: ./.github/workflows/module-update.yml
    with:
      module: spotube-nightly
      paths: modules/music/spotube/source.json
      command: nix-shell modules/music/spotube/update.sh nightly
      version-file: modules/music/spotube/source.json
    secrets: inherit

  git:
    uses: ./.github/workflows/module-update.yml
    with:
      module: spotube-git
      # The deps refresh runs the full gradle build.
      paths: modules/music/spotube/git.json modules/music/spotube/git-deps.json
      command: nix-shell modules/music/spotube/update.sh git
      version-file: modules/music/spotube/git.json
    secrets: inherit
