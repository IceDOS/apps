name: Update Spotube Nightly and Git

# Thin wrapper: all logic lives in .github/workflows/module-update.yml. The
# updater opens a PR and cache-server's external build gates the merge, so this
# repo's main only advances after a green build.
on:
  schedule:
    # GitHub may delay or skip scheduled runs, and they only run on the default branch.
    - cron: "10 9 * * *"
  workflow_dispatch:
permissions: {}

jobs:
  update:
    uses: ./.github/workflows/module-update.yml
    with:
      module: spotube
      paths: modules/spotube
      # Updates both pins: the nightly deb (source.json) and the dev branch build
      # (git.json + git-deps.json, whose refresh runs the full gradle build).
      command: nix-shell modules/spotube/update.sh
      title-command: >-
        echo "nightly $(jq -r .version modules/spotube/source.json), git $(jq -r .version modules/spotube/git.json)"
    secrets: inherit
