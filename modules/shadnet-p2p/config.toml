[icedos.applications.shadnet-p2p]
# host, seamless and seamlessAnySummonType seed shadnet.cfg on first start only,
# so later changes mean editing that file under stateDir or ~/.local/share/shadnet.

# Run the server as a managed systemd unit. False installs the binary only.
enable = false
# Bloodborne seamless co-op. Must match the client's mode. The shadps4 module's
# shadnet builds set SHADPS4_BLOODBORNE_SEAMLESS_COOP=1, so they all run seamless.
seamless = true
# Seamless-only: match signs whose SummonType is missing from the searcher's
# SummonTypeList. The sign keeps its original SummonType in the reply.
seamlessAnySummonType = true
# IP to bind. 0.0.0.0 makes the server reachable on the LAN.
host = "0.0.0.0"
# Writable state dir (SHADNET_HOME) for the database, config and score files.
stateDir = "/var/lib/shadnet-p2p"
# Open the server's TCP/UDP/HTTP ports in the firewall.
openFirewall = false
# Per-user systemd unit via home-manager (state in ~/.local/share/shadnet).
# Don't enable both this and `enable` because they bind the same ports.
userService = false
