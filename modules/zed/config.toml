[icedos.applications.zed]
terminalInitCommand = ""
autosave = false
extensions = []
extraPackages = []
fhs = false
formatOnSave = false
vim = false

[icedos.applications.zed.copySelectionLocation]
enable = false
keybind = "ctrl-alt-c"

[icedos.applications.zed.font]
name = "" # "" = use stylix font
size = 0 # 0 = use stylix size

[icedos.applications.zed.theme]
dark = "" # "" = use stylix theme
light = "" # "" = use stylix theme
mode = "system" # Options: 'system', 'dark', 'light'

[icedos.applications.zed.languages]

[icedos.applications.zed.lazygit]
enable = true
keybind = "ctrl-alt-q" # Unbound in Zed, the vim keymap, and OS defaults we know of; fires everywhere.

[icedos.applications.zed.lsp]

[icedos.applications.zed.agentBridge]
# Reopening a terminal thread resumes the agent session that ran in it; new threads
# open the agent-launch picker. Needs the agent-launch module from github:icedos/ai-tools.
enable = true
# Zed's thread list is only on the machine running Zed. For a terminal opened over SSH,
# the bridge SSHes back to that machine to read it, so it needs key login there.
remoteLookup = true
# Address for that SSH-back. "" finds it automatically: $USER@ the client IP that sshd puts
# in SSH_CONNECTION. Set it only when that IP is unreachable (NAT, jump host), the
# username differs, or you want a ~/.ssh/config alias, e.g. "ice@desktop".
sshTarget = ""
resolveTimeout = 3 # seconds to wait for Zed to store the probe title
zedDb = "~/.local/share/zed/db/0-stable/db.sqlite"
