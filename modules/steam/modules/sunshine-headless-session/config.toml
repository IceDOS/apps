[icedos.applications.steam.headless-session.main]
# Inject the normal Steam app (default HOME/account/library).
enable = true

[icedos.applications.steam.headless-session.secondary]
# Inject a second Steam app under secondary.path (separate account/library).
enable = false
# HOME for the second session; REQUIRED when secondary.enable = true.
path = ""

[icedos.applications.steam.headless-session.gamescope]
# Steam Display color controls (vibrance/temperature sliders); requires the patched gamescope.
colorManagement = true
# FSR/NIS sharpness: 0 = max sharp .. 20 = min sharp (gamescope default 2).
fsrSharpness = 20
# HDR-capable gamescope; stream HDR follows the client per-stream. false = always SDR.
hdr = true
# Forward Moonlight keyboard/mouse into the headless session; composites the cursor too (one feature).
inputInjection = true
# Render Proton Wayland games natively (patched gamescope); inert without steamOS.
nativeWayland = true
# Prefer the discrete GPU on hybrid rigs (stock picks the iGPU; upstream #2217). Inert on single GPU.
preferDiscreteGpu = true
# Gamescope --rt (realtime SCHED_FIFO); off = only SetNice(-20).
realtime = true
# Seconds (2m) with no gamescope at all before the minimal 1x1x1 probe gamescope is rerun (needs the daemon up); 0 = never regrow.
regrowTimeout = 120
# gamescope internal render height; 0 = output resolution.
renderHeight = 0
# gamescope internal render width, upscaled to output; 0 = output resolution.
renderWidth = 0
# Nits SDR content is shown at on the HDR output (203 = BT.2408 reference white).
sdrContentNits = 203
# SDR to wide-gamut stretch on the HDR output: 0 = accurate, 1 = full BT2020 (vivid).
sdrGamutWideness = 0
# gamescope upscaler (-F): fsr | nis | linear | nearest | pixel.
upscaleFilter = ""

[icedos.applications.steam.headless-session.session]
# Seconds (15m) with no active stream before the session is torn down (Steam + full gamescope); 0 = never tear down.
idleTimeout = 900
# Freeze the session cgroup ~10s after the last client leaves; thaw on reconnect.
pauseOnDisconnect = false

[icedos.applications.steam.headless-session.session.controllers]
# Keep host controllers out of the headless Steam (cgroup device policy denies /dev/input+hidraw).
excludeHost = true
# Hide the headless Sunshine pad from the host desktop (uaccess strip + setgid-`input` shim).
isolateVirtual = true

[icedos.applications.steam.headless-session.session.steam]
# MangoHud overlay (mangoapp): --mangoapp on the idle gamescope + STEAM_USE_MANGOAPP=1 on Steam.
mangoApp = true
# Steam Deck UI mode (`steam -steamos3`): Steam manages gamescope focus; takes over host Bluetooth.
steamOS = true

[icedos.applications.steam.headless-session.session.sunshine]
# Auto-start the headless daemon at the graphical session; false = start it manually.
autoStart = true
# App-menu launcher that starts the headless daemon (handy when autoStart = false).
desktopShortcut = true
# mDNS name; MUST differ from the primary.
name = "SteamOS Headless"
# Open the headless instance's derived port block in the host firewall (plain-LAN streaming).
openFirewall = false
# Base port (primary uses 47989); Sunshine derives its whole TCP/UDP block from it.
port = 48989
