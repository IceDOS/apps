# The headless gamescope session the second Sunshine daemon streams. The apps it
# publishes come from the consuming module (see apps.nix), so nothing here assumes Steam.

[icedos.applications.sunshine-headless]
# Apps to publish over Moonlight; each carries its own launch command and hooks.
apps = []

[icedos.applications.sunshine-headless.session]
# Backend for apps that name none and for Sunshine's startup probe; empty prefers gamescope.
defaultCompositor = ""
# Seconds (15m) with no active stream before the session is torn down (apps + full gamescope); 0 = never tear down.
idleTimeout = 900
# Freeze the session cgroup ~10s after the last client leaves; thaw on reconnect.
pauseOnDisconnect = false

[icedos.applications.sunshine-headless.session.controllers]
# Keep host controllers out of the session (cgroup device policy denies /dev/input+hidraw).
# The scope keeps the caller's groups, and the module's polkit rules restore the session holds.
excludeHost = true
# Hide the session's virtual pad from the host desktop (uaccess strip + setgid-`input` shim).
isolateVirtual = true

[icedos.applications.sunshine-headless.session.sunshine]
# Pad Sunshine emulates: auto follows the client's reported type (Sunshine has no per-app type).
gamepad = "auto"
# Auto-start the headless daemon at the graphical session; false = start it manually.
autoStart = true
# App-menu launcher that starts the headless daemon (handy when autoStart = false).
desktopShortcut = true
# mDNS name; MUST differ from the primary.
name = "Headless Session"
# Open the headless instance's derived port block in the host firewall (plain-LAN streaming).
openFirewall = false
# Base port (primary uses 47989); Sunshine derives its whole TCP/UDP block from it.
port = 48989
